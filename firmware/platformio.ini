; Ceiling projection alarm clock - ESP32-S3-DevKitC-1 (N16R8: 16 MB flash, 8 MB PSRAM)
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
extra_scripts = pre:build_stamp.py
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit PCD8544 Nokia 5110 LCD library
    adafruit/Adafruit NeoPixel
    adafruit/RTClib
    smougenot/TM1637
    bblanchon/ArduinoJson @ ^7
    tzapu/WiFiManager
    https://github.com/schreibfaul1/ESP32-audioI2S.git#4.0.1
