<text x="820" y="244" font-size="11.5" fill="#222" text-anchor="start" font-weight="400">SIG/PWM → GPIO 13</text>
<text x="820" y="261" font-size="11.5" fill="#222" text-anchor="start" font-weight="400">VIN+ → +5 V, VIN− → GND</text>
<text x="820" y="278" font-size="11.5" fill="#222" text-anchor="start" font-weight="400">OUT+ → 4.7 Ω 2 W → LED+</text>
<text x="820" y="295" font-size="11.5" fill="#222" text-anchor="start" font-weight="400">LED− → OUT−</text>
<text x="820" y="312" font-size="11.5" fill="#222" text-anchor="start" font-weight="400">LED star on a heatsink</text>
<text x="820" y="329" font-size="11.5" fill="#222" text-anchor="start" font-weight="400">(or metal) while testing</text>
<polyline fill="none" stroke="#d33a2c" stroke-width="3"  stroke-linejoin="round" stroke-linecap="round" points="840,200 840,150"/>
<circle cx="840" cy="150" r="5" fill="#d33a2c"/>
