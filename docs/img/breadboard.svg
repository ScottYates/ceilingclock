<text x="340" y="218" font-size="12.5" fill="#fff" text-anchor="start" font-weight="700">MAX98357A amplifier</text>
<text x="340" y="244" font-size="11.5" fill="#222" text-anchor="start" font-weight="400">BCLK → GPIO 15</text>
<text x="340" y="261" font-size="11.5" fill="#222" text-anchor="start" font-weight="400">LRC → GPIO 16</text>
<text x="340" y="278" font-size="11.5" fill="#222" text-anchor="start" font-weight="400">DIN → GPIO 17</text>
<text x="340" y="295" font-size="11.5" fill="#222" text-anchor="start" font-weight="400">VIN → +5 V, GND → GND</text>
<text x="340" y="312" font-size="11.5" fill="#222" text-anchor="start" font-weight="400">40 mm speaker on + / −</text>
<text x="340" y="329" font-size="11.5" fill="#222" text-anchor="start" font-weight="400">100 µF across VIN/GND</text>
<polyline fill="none" stroke="#d33a2c" stroke-width="3"  stroke-linejoin="round" stroke-linecap="round" points="360,200 360,150"/>
<circle cx="360" cy="150" r="5" fill="#d33a2c"/>
