<text x="474" y="644" font-size="11.5" fill="#222" text-anchor="start" font-weight="400">SDA → GPIO 1</text>
<text x="474" y="661" font-size="11.5" fill="#222" text-anchor="start" font-weight="400">SCL → GPIO 2</text>
<text x="474" y="678" font-size="11.5" fill="#222" text-anchor="start" font-weight="400">VCC → 3V3, GND → GND</text>
