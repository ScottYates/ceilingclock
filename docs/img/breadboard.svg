<text x="676" y="661" font-size="11.5" fill="#222" text-anchor="start" font-weight="400">10 kΩ: junction → GND</text>
<text x="676" y="678" font-size="11.5" fill="#222" text-anchor="start" font-weight="400">junction → GPIO 7</text>
<polyline fill="none" stroke="#e08a00" stroke-width="3"  stroke-linejoin="round" stroke-linecap="round" points="696,600 696,545"/>
