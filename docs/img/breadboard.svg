<rect x="868" y="616" width="190" height="10" rx="0" fill="#555" stroke="none" stroke-width="1.5"/>
<text x="878" y="618" font-size="12.5" fill="#fff" text-anchor="start" font-weight="700">Buttons</text>
<text x="878" y="644" font-size="11.5" fill="#222" text-anchor="start" font-weight="400">A: GPIO 6 → button → GND</text>
<text x="878" y="661" font-size="11.5" fill="#222" text-anchor="start" font-weight="400">B: GPIO 14 → button → GND</text>
<text x="878" y="678" font-size="11.5" fill="#222" text-anchor="start" font-weight="400">no resistors needed</text>
<polyline fill="none" stroke="#2b5fd9" stroke-width="3"  stroke-linejoin="round" stroke-linecap="round" points="923,600 923,570"/>
<circle cx="923" cy="570" r="5" fill="#2b5fd9"/>
<text x="330" y="470" font-size="12.5" fill="#333" text-anchor="start" font-weight="400">Signal wires go straight from each module to the GPIO shown (numbers as printed on the board).</text>
<text x="330" y="490" font-size="12.5" fill="#333" text-anchor="start" font-weight="400">Logic modules run on 3.3 V. Only the amplifier, ring and LED use the external 5 V.</text>
<text x="330" y="510" font-size="12.5" fill="#626a73" text-anchor="start" font-weight="400">Use short, thick leads for the LED and ring: breadboard contacts are fine for testing, not for keeps.</text>
