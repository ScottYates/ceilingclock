<text x="215" y="284" font-size="13.5" fill="#fff" text-anchor="middle" font-weight="700">ESP32-S3-DevKitC-1</text>
<text x="215" y="310" font-size="11.5" fill="#cfd3da" text-anchor="middle" font-weight="400">USB → your computer:</text>
<text x="215" y="326" font-size="11.5" fill="#cfd3da" text-anchor="middle" font-weight="400">power, flashing and</text>
<text x="215" y="342" font-size="11.5" fill="#cfd3da" text-anchor="middle" font-weight="400">the serial log (115200)</text>
<text x="215" y="370" font-size="11.5" fill="#ff8a80" text-anchor="middle" font-weight="700">5V pin: leave unconnected</text>
<text x="215" y="386" font-size="11.5" fill="#ff8a80" text-anchor="middle" font-weight="400">while on the computer's USB</text>
