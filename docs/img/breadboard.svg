<text x="580" y="244" font-size="11.5" fill="#222" text-anchor="start" font-weight="400">DIN → 330 Ω → GPIO 18</text>
<text x="580" y="261" font-size="11.5" fill="#222" text-anchor="start" font-weight="400">5V → +5 V, GND → GND</text>
<text x="580" y="278" font-size="11.5" fill="#222" text-anchor="start" font-weight="400">1000 µF across 5V/GND,</text>
<text x="580" y="295" font-size="11.5" fill="#222" text-anchor="start" font-weight="400">right at the ring (− to GND)</text>
<polyline fill="none" stroke="#d33a2c" stroke-width="3"  stroke-linejoin="round" stroke-linecap="round" points="600,200 600,150"/>
<circle cx="600" cy="150" r="5" fill="#d33a2c"/>
